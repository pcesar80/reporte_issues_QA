<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dashboard QA</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body { font-family: Arial; margin: 20px; background: #f5f6fa; }

.header {
  display:flex;
  justify-content: space-between;
  align-items:center;
}

h1 { color: #2f3640; margin: 0; }

.logo { height: 50px; }

.proyecto-titulo { font-size: 0.85em; margin-left: 10px; color: #555; }

.barra-superior {
  display: flex;
  justify-content: flex-start;
  align-items: center;
  margin-bottom: 15px;
  gap: 10px;
}

.panel-derecho {
  display: flex;
  flex-direction: row;
  gap: 10px;
  align-items: center;
}

.filtro-version {
  display: flex;
  align-items: center;
  gap: 5px;
}

.tabs {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-top: 10px;
}

.tab-button {
  padding: 5px 10px;
  cursor: pointer;
  border-radius: 5px;
  border: 1px solid #ccc;
}

.tab-button.active {
  background-color: #007bff;
  color: white;
}

.view { display: none; margin-top: 20px; }
.active { display: block; }

.grid-kpi {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
}

.grid-graficos {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-top:15px;
}

.grid-graficos .card {
  height: 260px;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

canvas {
      width: 100% !important;
      height: 180px !important;
      max-height: 180px !important;
    }

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

th, td {
  border: 1px solid #ddd;
  padding: 6px;
  text-align: center;
}

th { background: #eee; }
</style>
</head>

<body>

<div class="header">
  <h1>📊 Dashboard QA <span id="tituloProyecto" class="proyecto-titulo"></span></h1>
  <img class="logo"
       src="https://raw.githubusercontent.com/pcesar80/reporte_issues_QA/main/LogoCMA.png"
       crossOrigin="anonymous">
</div>

<div class="barra-superior">
  <input type="file" id="fileInput" accept=".csv">
  <button onclick="cargarDesdeOpenProject()">🔄 Cargar desde OpenProject</button>

  <div class="panel-derecho">
    <div class="filtro-version">
      <label><b>Versión:</b></label>
      <select id="filtroVersion"></select>
    </div>
    <button onclick="exportarPDF()">📄 Exportar PDF</button>
  </div>
</div>

<div class="tabs">
  <button class="tab-button active" onclick="showView('mainView', this)">Indicadores / Top 5</button>
  <button class="tab-button" onclick="showView('noDateView', this)">Issues sin fecha</button>
  <button class="tab-button" onclick="showView('allIssuesView', this)">Todos los issues</button>
</div>

<div id="mainView" class="view active">

<h2>📌 Top 5 tareas más antiguas</h2>
<div class="card">
<table id="topTareas">
<thead>
<tr><th>ID</th><th>Asunto</th><th>Estado</th><th>Días abierta</th></tr>
</thead>
<tbody></tbody>
</table>
</div>

<h2>📊 Indicadores</h2>
<div class="grid-kpi">
<div class="card"><h3>Estado</h3><table id="tablaEstado"></table></div>
<div class="card"><h3>Severidad</h3><table id="tablaSeveridad"></table></div>
<div class="card"><h3>Prioridad</h3><table id="tablaPrioridad"></table></div>
</div>

<h2>📊 Gráficos</h2>
<div class="grid-graficos">
<div class="card"><canvas id="estadoChart"></canvas></div>
<div class="card"><canvas id="severidadChart"></canvas></div>
<div class="card"><canvas id="prioridadChart"></canvas></div>
</div>

<h2>📈 Tiempo por asignado</h2>
<div class="card">
<canvas id="tiempoChart" style="height:300px !important;"></canvas>
</div>

</div>

<div id="noDateView" class="view">
<h2>⚠️ Issues sin fecha</h2>
<div class="card">
<table id="tablaSinFecha">
<thead><tr><th>ID</th><th>Versión</th><th>Estado</th></tr></thead>
<tbody></tbody>
</table>
</div>
</div>

<div id="allIssuesView" class="view">
<h2>📋 Todos los issues</h2>
<div class="card">
<table id="tablaTodos">
<thead><tr><th>ID</th><th>Descripción</th><th>Estado</th></tr></thead>
<tbody></tbody>
</table>
</div>
</div>

<script>
let dataOriginal=[];
let charts={};

document.getElementById('fileInput').addEventListener('change',handleFile);
document.getElementById('filtroVersion').addEventListener('change',aplicarFiltro);

function showView(viewId,btn){
document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
document.getElementById(viewId).classList.add('active');
document.querySelectorAll('.tab-button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
}

function splitCSVLine(line,sep){
const result=[];let current='';let inside=false;
for(let c of line){
if(c==='"') inside=!inside;
else if(c===sep&&!inside){result.push(current);current='';}
else current+=c;
}
result.push(current);
return result;
}

function parseCSV(text){
const lines=text.split(/\r?\n/).filter(l=>l.trim());
const sep=lines[0].includes(';')?';':',';
const headers=lines[0].split(sep).map(h=>h.replace(/"/g,'').toLowerCase().trim());
return lines.slice(1).map(l=>{
const values=splitCSVLine(l,sep);
let o={};
headers.forEach((h,i)=>o[h]=(values[i]||'').replace(/"/g,'').trim());
return o;
});
}

function parseFecha(f){
if(!f) return null;
const m=f.match(/(\d{1,2})[\.\/](\d{1,2})[\.\/](\d{4})/);
if(!m) return null;
return new Date(`${m[3]}-${m[2]}-${m[1]}`);
}

function handleFile(e){
const r=new FileReader();
r.onload=e=>{
dataOriginal=parseCSV(e.target.result);
cargarFiltroVersion(dataOriginal);
procesar(dataOriginal);
};
r.readAsText(e.target.files[0]);
}

function cargarFiltroVersion(data){
const s=document.getElementById("filtroVersion");
const set=new Set();
data.forEach(t=>t["versión"]&&set.add(t["versión"]));
s.innerHTML='<option value="ALL">Todas</option>';
set.forEach(v=>s.innerHTML+=`<option value="${v}">${v}</option>`);
}

function aplicarFiltro(){
const v=document.getElementById("filtroVersion").value;
procesar(v==="ALL"?dataOriginal:dataOriginal.filter(t=>t["versión"]===v));
}

function procesar(data){
let estado={},severidad={},prioridad={};
let tareas=[],sinFecha=[],tiempo={},proyectos=new Set();

data.forEach(t=>{
const id=t.id;if(!id)return;
if(t.proyecto)proyectos.add(t.proyecto);

const est=(t.estado||"").trim();
const estL=est.toLowerCase().replace(/\s/g,'');
if(est)estado[est]=(estado[est]||0)+1;

if(t.severidad)severidad[t.severidad]=(severidad[t.severidad]||0)+1;
if(t.prioridad)prioridad[t.prioridad]=(prioridad[t.prioridad]||0)+1;

if(["closed","cerrado","done"].includes(estL))return;

const inicio=parseFecha(t["fecha de inicio"]);
if(!inicio){sinFecha.push({id,version:t["versión"],estado:est});return;}

const dias=Math.floor((new Date()-inicio)/86400000);
tareas.push({id,asunto:t.asunto||"-",estado:est,dias});
});

document.getElementById("tituloProyecto").innerText=[...proyectos].join("_");

// Top 5
document.querySelector("#topTareas tbody").innerHTML=
tareas.sort((a,b)=>b.dias-a.dias).slice(0,5).map(t=>`
<tr>
<td><a href="https://openproject.casademoneda.gob.ar/projects/nuevo-sistema-rrhh/work_packages/${t.id}/relations" target="_blank">${t.id}</a></td>
<td>${t.asunto}</td>
<td>${t.estado}</td>
<td>${t.dias}</td>
</tr>`).join("");

// Issues sin fecha (con link)
document.querySelector("#tablaSinFecha tbody").innerHTML=
sinFecha.map(t=>`
<tr>
<td><a href="https://openproject.casademoneda.gob.ar/projects/nuevo-sistema-rrhh/work_packages/${t.id}/relations" target="_blank">${t.id}</a></td>
<td>${t.version}</td>
<td>${t.estado}</td>
</tr>`).join("");

// Todos los issues (restaurado)
document.querySelector("#tablaTodos tbody").innerHTML=
data.map(t=>`
<tr>
<td><a href="https://openproject.casademoneda.gob.ar/projects/nuevo-sistema-rrhh/work_packages/${t.id}/relations" target="_blank">${t.id}</a></td>
<td>${t.asunto||"-"}</td>
<td>${t.estado||"-"}</td>
</tr>`).join("");

generarTabla("tablaEstado",estado);
generarTabla("tablaSeveridad",severidad);
generarTabla("tablaPrioridad",prioridad);

crearGraficoUniforme("estadoChart","severidadChart","prioridadChart",{estado,severidad,prioridad});
}

function generarTabla(id,data){
let html="<tr><th>Tipo</th><th>Cantidad</th></tr>";
Object.entries(data).forEach(([k,v])=>html+=`<tr><td>${k}</td><td>${v}</td></tr>`);
document.getElementById(id).innerHTML=html;
}

function crearGraficoUniforme(id1,id2,id3,d){
[id1,id2,id3].forEach(i=>charts[i]&&charts[i].destroy());
const keys=Object.keys(d);
[id1,id2,id3].forEach((id,i)=>{
charts[id]=new Chart(document.getElementById(id),{
type:'pie',
data:{labels:Object.keys(d[keys[i]]),datasets:[{data:Object.values(d[keys[i]])}]}
});
});
}

function exportarPDF(){
const {jsPDF}=window.jspdf;
html2canvas(document.body,{scale:2,useCORS:true}).then(c=>{
const pdf=new jsPDF();
pdf.addImage(c.toDataURL("image/png"),'PNG',10,10,190,0);
pdf.save("dashboard.pdf");
});
}

function cargarDesdeOpenProject(){
const w=window.open("https://openproject.casademoneda.gob.ar","");
setTimeout(()=>{
if(!w||w.closed){
alert("⚠️ Debes iniciar sesión en OpenProject primero");
}else{
window.open("https://openproject.casademoneda.gob.ar/projects/nuevo-sistema-rrhh/work_packages.csv?query_id=960");
}
},1500);
}
</script>

</body>
</html>
