<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard QA</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body { font-family: Arial; margin: 20px; background: #f5f6fa; }
    h1 { color: #2f3640; margin: 0; }
    .proyecto-titulo { font-size: 0.85em; margin-left: 10px; color: #555; }

    .barra-superior {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .panel-derecho {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 5px;
    }

    .filtro-version {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .tab-button {
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .tab-button.active {
      background-color: #007bff;
      color: white;
      border-color: #007bff;
    }

    .view { display: none; margin-top: 20px; }
    .active { display: block; }

    .grid-kpi {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    canvas {
      width: 100% !important;
      height: 180px !important;
      max-height: 180px !important;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 6px;
      text-align: center;
    }

    th { background: #eee; }
  </style>
</head>

<body>

<h1>
  📊 Dashboard QA
  <span id="tituloProyecto" class="proyecto-titulo"></span>
</h1>

<div class="barra-superior">
  <input type="file" id="fileInput" accept=".csv">

  <div class="panel-derecho">
    <div class="filtro-version">
      <label><b>Versión:</b></label>
      <select id="filtroVersion"></select>
    </div>

    <button onclick="exportarPDF()">📄 Exportar PDF</button>
  </div>
</div>

<div class="tabs">
  <button class="tab-button active" onclick="showView('mainView', this)">Indicadores / Top 5</button>
  <button class="tab-button" onclick="showView('noDateView', this)">Issues sin fecha</button>
  <button class="tab-button" onclick="showView('allIssuesView', this)">Todos los issues</button>
</div>

<div id="mainView" class="view active">

  <h2>📌 Top 5 tareas más antiguas</h2>
  <div class="card">
    <table id="topTareas">
      <thead>
        <tr>
          <th>ID</th>
          <th>Asunto</th>
          <th>Estado</th>
          <th>Días abierta</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <h2>📊 Indicadores</h2>
  <div class="grid-kpi">
    <div class="card">
      <h3>Estado</h3>
      <table id="tablaEstado"></table>
      <canvas id="estadoChart"></canvas>
    </div>
    <div class="card">
      <h3>Severidad</h3>
      <table id="tablaSeveridad"></table>
      <canvas id="severidadChart"></canvas>
    </div>
    <div class="card">
      <h3>Prioridad</h3>
      <table id="tablaPrioridad"></table>
      <canvas id="prioridadChart"></canvas>
    </div>
  </div>

  <h2>📈 Tiempo por asignado</h2>
<div class="card">
  <canvas id="tiempoChart" style="height: 300px !important;"></canvas>
</div>

</div>

<div id="noDateView" class="view">
  <h2>⚠️ Issues sin fecha</h2>
  <div class="card">
    <table id="tablaSinFecha">
      <thead>
        <tr>
          <th>ID</th>
          <th>Versión</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<div id="allIssuesView" class="view">
  <h2>📋 Todos los issues</h2>
  <div class="card">
    <table id="tablaTodos">
      <thead>
        <tr>
          <th>ID</th>
          <th>Descripción</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
let dataOriginal = [];
let proyectoActual = "";
let charts = {};

document.getElementById('fileInput').addEventListener('change', handleFile);
document.getElementById('filtroVersion').addEventListener('change', aplicarFiltro);

function showView(viewId, btn) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(viewId).classList.add('active');
  document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function splitCSVLine(line, sep) {
  const result = []; let current=''; let insideQuotes=false;
  for(let i=0;i<line.length;i++){
    const char=line[i];
    if(char==='"'){insideQuotes=!insideQuotes;}
    else if(char===sep&&!insideQuotes){result.push(current);current='';}
    else{current+=char;}
  }
  result.push(current); return result;
}

function parseCSV(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim()!=='');
  const sep=lines[0].includes(';')?';':',';
  const headers=lines[0].split(sep).map(h=>h.replace(/"/g,'').trim().toLowerCase());
  return lines.slice(1).map(line=>{
    const values=splitCSVLine(line,sep);
    let obj={};
    headers.forEach((h,i)=>obj[h]=(values[i]||'').replace(/"/g,'').trim());
    return obj;
  });
}

function parseFecha(f){
  if(!f) return null;
  const [d,m,y]=f.split('/');
  return new Date(`${y}-${m}-${d}`);
}

function handleFile(e){
  const reader=new FileReader();
  reader.onload=e=>{
    dataOriginal=parseCSV(e.target.result);
    cargarFiltroVersion(dataOriginal);
    procesar(dataOriginal);
  };
  reader.readAsText(e.target.files[0]);
}

function cargarFiltroVersion(data){
  const select=document.getElementById("filtroVersion");
  const versiones=new Set();
  data.forEach(t=>{if(t["versión"])versiones.add(t["versión"]);});
  select.innerHTML='<option value="ALL">Todas</option>';
  versiones.forEach(v=>select.innerHTML+=`<option value="${v}">${v}</option>`);
}

function aplicarFiltro(){
  const version=document.getElementById("filtroVersion").value;
  const filtrado=version==="ALL"?dataOriginal:dataOriginal.filter(t=>t["versión"]===version);
  procesar(filtrado);
}

function procesar(data){
  let estado={}, severidad={}, prioridad={};
  let tareasConFecha=[], issuesSinFecha=[];
  let tiempoPorAsignado = {};
  let proyectos=new Set();

  data.forEach(t=>{
    const id=t.id; if(!id)return;

    if(t.proyecto) proyectos.add(t.proyecto);

    const est=(t.estado||"").trim();
    const estLower = est.toLowerCase().replace(/\s/g,'');

    if(est) estado[est]=(estado[est]||0)+1;

    const sev = t.severidad;
    const pri = t.prioridad;

    if(sev) severidad[sev]=(severidad[sev]||0)+1;
    if(pri) prioridad[pri]=(prioridad[pri]||0)+1;

    const estadosCerrados=["closed","cerrado","done"];
    if(estadosCerrados.includes(estLower)) return;

    const asignado = t["asignado a"] || "Sin asignar";
    const tiempo = t["tiempo invertido"];
    if (tiempo && !isNaN(parseFloat(tiempo))) {
      tiempoPorAsignado[asignado] = (tiempoPorAsignado[asignado] || 0) + 1;
    }

    const inicio=parseFecha(t["fecha de inicio"]);
    if(!inicio){
      issuesSinFecha.push({id,version:t["versión"]||"-",estado:est});
      return;
    }

    const dias=Math.floor((new Date()-inicio)/86400000);
    tareasConFecha.push({id,asunto:t.asunto||"-",estado:est,dias});
  });

  document.getElementById("tituloProyecto").innerText=Array.from(proyectos).join("_");

  document.querySelector("#topTareas tbody").innerHTML=
    tareasConFecha.sort((a,b)=>b.dias-a.dias).slice(0,5)
    .map(t=>`<tr><td>${t.id}</td><td>${t.asunto}</td><td>${t.estado}</td><td>${t.dias}</td></tr>`).join("");

  document.querySelector("#tablaSinFecha tbody").innerHTML=
    issuesSinFecha.map(t=>`
    <tr>
      <td><a href="https://openproject.casademoneda.gob.ar/projects/nuevo-sistema-rrhh/work_packages/${t.id}/relations" target="_blank">${t.id}</a></td>
      <td>${t.version}</td>
      <td>${t.estado}</td>
    </tr>`).join("");

  document.querySelector("#tablaTodos tbody").innerHTML=
    data.map(t=>`
    <tr>
      <td><a href="https://openproject.casademoneda.gob.ar/projects/nuevo-sistema-rrhh/work_packages/${t.id}/relations" target="_blank">${t.id}</a></td>
      <td>${t.asunto||"-"}</td>
      <td>${t.estado||"-"}</td>
    </tr>`).join("");

  generarTabla("tablaEstado",estado);
  generarTabla("tablaSeveridad",severidad);
  generarTabla("tablaPrioridad",prioridad);

  crearGraficoUniforme(
    "estadoChart",
    "severidadChart",
    "prioridadChart",
    {estado, severidad, prioridad}
  );

  crearGraficoLinea("tiempoChart", tiempoPorAsignado);
}

function generarTabla(id,data){
  const table=document.getElementById(id);
  let html=`<tr><th>Tipo</th><th>Cantidad</th></tr>`;
  Object.entries(data).forEach(([k,v])=>html+=`<tr><td>${k}</td><td>${v}</td></tr>`);
  table.innerHTML=html;
}

function crearGraficoUniforme(id1,id2,id3,datasets){
  [id1,id2,id3].forEach(id=>{if(charts[id]) charts[id].destroy();});

  const colores=["#808080","#007bff","#28a745","#ffa500","#ffff00","#ff0000"];
  const keys=Object.keys(datasets);

  [id1,id2,id3].forEach((id,i)=>{
    const ctx=document.getElementById(id);
    charts[id]=new Chart(ctx,{
      type:'pie',
      data:{ 
        labels:Object.keys(datasets[keys[i]]), 
        datasets:[{data:Object.values(datasets[keys[i]]), backgroundColor:colores}] 
      }
    });
  });
}

function crearGraficoLinea(id, data) {
  const ctx = document.getElementById(id);
  if (charts[id]) charts[id].destroy();

  charts[id] = new Chart(ctx, {
    type: 'line',
    data: {
      labels: Object.keys(data),
      datasets: [{
        label: 'Issues',
        data: Object.values(data),
        fill: false,
        tension: 0.3
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false, // 🔥 CLAVE
      scales: {
        y: {
          beginAtZero: true,
          ticks: { precision: 0 }
        }
      }
    }
  });
}

function exportarPDF(){
  const { jsPDF } = window.jspdf;
  const dashboard = document.querySelector(".view.active");

  const hoy = new Date();
  const fecha = `${String(hoy.getDate()).padStart(2,'0')}-${String(hoy.getMonth()+1).padStart(2,'0')}-${hoy.getFullYear()}`;

  html2canvas(dashboard,{scale:2}).then(canvas=>{
    const pdf=new jsPDF();
    pdf.addImage(canvas.toDataURL("image/png"),'PNG',10,10,190,0);
    pdf.save(`Dashboard issues ${fecha}.pdf`);
  });
}
</script>

</body>
</html>
